<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SG Calculator</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px;">

    <nav style="margin-bottom: 20px;">
        <strong>Quick Calculator</strong> | <a href="logger.html">Go to Shot Logger</a>
    </nav>

    <h2>🏌️ Quick Strokes Gained Calculator (Sandbox)</h2>
    
    <form id="calcForm" style="display: flex; flex-direction: column; width: 300px; gap: 10px;">
        <label>Start Distance (yards/feet):</label>
        <input type="number" id="startDist" required>

        <label>Start Lie:</label>
        <select id="startLie">
            <option value="tee">Tee</option>
            <option value="fairway">Fairway</option>
            <option value="rough">Rough</option>
            <option value="sand">Sand</option>
            <option value="green">Green</option>
        </select>

        <label>End Distance (yards/feet):</label>
        <input type="number" id="endDist" required>

        <label>End Lie:</label>
        <select id="endLie">
            <option value="fairway">Fairway</option>
            <option value="rough">Rough</option>
            <option value="sand">Sand</option>
            <option value="green">Green</option>
        </select>

        <button type="submit" style="margin-top: 10px; padding: 10px;">Calculate SG</button>
    </form>

    <h3 style="margin-top: 30px;">Result: <span id="result" style="color: blue;">---</span></h3>

    <script>
        document.getElementById('calcForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let sd = document.getElementById('startDist').value;
            let sl = document.getElementById('startLie').value;
            let ed = document.getElementById('endDist').value;
            let el = document.getElementById('endLie').value;

            let url = `http://localhost:8080/api/v1/shots/calculate?startDist=${sd}&startLie=${sl}&endDist=${ed}&endLie=${el}`;

            fetch(url)
                .then(response => response.text()) 
                .then(data => {
                    document.getElementById('result').innerText = parseFloat(data).toFixed(3);
                })
                .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
