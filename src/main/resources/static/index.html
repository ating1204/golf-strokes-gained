<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strokes Gained Test</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px;">

    <h2>Strokes Gained Calculator [BETA]</h2>
    
    <form id="sgForm" style="display: flex; flex-direction: column; width: 300px; gap: 10px;">
        
        <label>Start Distance (yards/feet):</label>
        <input type="number" id="startDist" required>

        <label>Start Lie:</label>
        <select id="startLie">
            <option value="tee">Tee</option>
            <option value="fairway">Fairway</option>
            <option value="rough">Rough</option>
            <option value="sand">Sand</option>
            <option value="green">Green</option>
        </select>

        <label>End Distance (yards/feet):</label>
        <input type="number" id="endDist" required>

        <label>End Lie:</label>
        <select id="endLie">
            <option value="fairway">Fairway</option>
            <option value="rough">Rough</option>
            <option value="sand">Sand</option>
            <option value="green">Green</option>
            <option value="holed">Holed</option>
        </select>

        <button type="submit" style="margin-top: 10px; padding: 10px;">Calculate SG</button>
    </form>

    <h3 style="margin-top: 30px;">Result: <span id="result" style="color: blue;">---</span></h3>

    <script>
        document.getElementById('sgForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page from refreshing

            // Get values from the form
            let sd = document.getElementById('startDist').value;
            let sl = document.getElementById('startLie').value;
            let ed = document.getElementById('endDist').value;
            let el = document.getElementById('endLie').value;

            // Build the URL to call your Java controller
            let url = `http://localhost:8080/api/v1/calculator/shot?startDist=${sd}&startLie=${sl}&endDist=${ed}&endLie=${el}`;

            // Make the request to the backend
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Database lookup failed! Check your distance/lie.");
                    return response.text(); 
                })
                .then(data => {
                    // Update the screen with the number
                    document.getElementById('result').innerText = parseFloat(data).toFixed(3);
                })
                .catch(error => {
                    document.getElementById('result').innerText = "Error: " + error.message;
                    document.getElementById('result').style.color = "red";
                });
        });
    </script>
</body> 
</html>
