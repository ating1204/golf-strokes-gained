<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SG Logger</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #222; }
        .layout { display: flex; gap: 48px; align-items: flex-start; flex-wrap: wrap; }
        form { display: flex; flex-direction: column; width: 300px; gap: 10px; flex-shrink: 0; }
        label { font-size: 0.95em; }
        input, select, button { padding: 8px; font-size: 14px; }
        table { border-collapse: collapse; min-width: 640px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; }
        th { background: #f4f6f8; font-weight: 600; }
        tr:nth-child(even) { background: #fafafa; }
        .sg-pos { color: #1a7f37; }
        .sg-neg { color: #c0392b; }
        .table-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 12px; }
        .muted { color: #888; font-size: 0.9em; }
        .danger { background: none; border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
        .danger:hover { border-color: #c0392b; color: #c0392b; }
        .undo { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
        .undo:hover { background: #f4f6f8; }
        .save { margin-top: 10px; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <nav style="margin-bottom: 20px;">
        <a href="calc.html">Go to Quick Calculator</a> | <strong>Shot Logger</strong>
    </nav>

    <h2>Strokes Gained Data Logger</h2>
    <p class="muted">Shots entered here will be saved to your database.</p>

    <div class="layout">
        <form id="logForm">
            <label for="startLie">Start Lie:</label>
            <select id="startLie">
                <option value="tee">Tee</option>
                <option value="fairway">Fairway</option>
                <option value="rough">Rough</option>
                <option value="sand">Sand</option>
                <option value="green">Green</option>
            </select>

            <label for="startDist" id="startDistLabel">Start Distance (yards):</label>
            <input type="number" id="startDist" min="0" required>

            <label for="endLie">End Lie:</label>
            <select id="endLie">
                <option value="fairway">Fairway</option>
                <option value="rough">Rough</option>
                <option value="sand">Sand</option>
                <option value="green">Green</option>
            </select>

            <label for="endDist" id="endDistLabel">End Distance (yards):</label>
            <input type="number" id="endDist" min="0" required>

            <label for="penaltyStrokes">Penalty Strokes:</label>
            <input type="number" id="penaltyStrokes" value="0" min="0" required>

            <label for="clubUsed">Club Used:</label>
            <select id="clubUsed" required>
                <option value="" disabled selected>Select a club</option>
                <option value="Driver">Driver</option>
                <option value="5-Wood">5-Wood</option>
                <option value="4-Wood">4-Wood</option>
                <option value="4-Hybrid">4-Hybrid</option>
                <option value="5-iron">5-iron</option>
                <option value="6-iron">6-iron</option>
                <option value="7-iron">7-iron</option>
                <option value="8-iron">8-iron</option>
                <option value="9-iron">9-iron</option>
                <option value="44°">44°</option>
                <option value="50°">50°</option>
                <option value="54°">54°</option>
                <option value="58°">58°</option>
                <option value="Putter">Putter</option>
            </select>

            <button type="submit" class="save">Save Shot to Database</button>
        </form>

        <div>
            <div class="table-header">
                <h3 style="margin: 0;">Logged Shots</h3>
                <button type="button" class="undo" id="undoBtn">Undo last shot</button>
            </div>
            <p class="muted" id="tableStatus">Loading…</p>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Club</th>
                        <th>Pen</th>
                        <th>SG</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="shotTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <h3 style="margin-top: 30px;">Saved SG Result: <span id="logResult">---</span></h3>

    <script>
        const API = '/api/v1/shots';

        function distLabel(prefix, lie) {
            const unit = lie === 'green' ? 'feet' : 'yards';
            return prefix + ' Distance (' + unit + '):';
        }

        function updateDistLabels() {
            document.getElementById('startDistLabel').innerText =
                distLabel('Start', document.getElementById('startLie').value);
            document.getElementById('endDistLabel').innerText =
                distLabel('End', document.getElementById('endLie').value);
        }

        function formatLieDist(lie, dist) {
            const unit = lie === 'green' ? 'ft' : 'yd';
            return dist + ' ' + unit + ' ' + lie;
        }

        function formatSg(value) {
            if (value == null || Number.isNaN(value)) return '—';
            const n = Number(value);
            const text = (n >= 0 ? '+' : '') + n.toFixed(3);
            const cls = n >= 0 ? 'sg-pos' : 'sg-neg';
            return '<span class="' + cls + '">' + text + '</span>';
        }

        function setResult(text, ok) {
            const el = document.getElementById('logResult');
            el.innerText = text;
            el.style.color = ok ? '#1a7f37' : '#c0392b';
        }

        function loadShots() {
            const status = document.getElementById('tableStatus');
            fetch(API)
                .then(r => {
                    if (!r.ok) throw new Error('Could not load shots');
                    return r.json();
                })
                .then(shots => {
                    const body = document.getElementById('shotTableBody');
                    body.innerHTML = '';
                    if (!shots.length) {
                        status.innerText = 'No shots logged yet.';
                        return;
                    }
                    status.innerText = shots.length + ' shot' + (shots.length === 1 ? '' : 's');
                    shots.forEach((shot, i) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML =
                            '<td>' + (shots.length - i) + '</td>' +
                            '<td>' + formatLieDist(shot.startLie, shot.startDist) + '</td>' +
                            '<td>' + formatLieDist(shot.endLie, shot.endDist) + '</td>' +
                            '<td>' + (shot.clubUsed || '') + '</td>' +
                            '<td>' + (shot.penaltyStrokes ?? 0) + '</td>' +
                            '<td>' + formatSg(shot.strokesGained) + '</td>' +
                            '<td><button type="button" class="danger" data-id="' + shot.id + '">Delete</button></td>';
                        body.appendChild(tr);
                    });
                })
                .catch(err => {
                    status.innerText = err.message;
                });
        }

        document.getElementById('startLie').addEventListener('change', updateDistLabels);
        document.getElementById('endLie').addEventListener('change', updateDistLabels);
        updateDistLabels();

        document.getElementById('logForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const params = new URLSearchParams({
                startDist: document.getElementById('startDist').value,
                startLie: document.getElementById('startLie').value,
                endDist: document.getElementById('endDist').value,
                endLie: document.getElementById('endLie').value,
                penaltyStrokes: document.getElementById('penaltyStrokes').value,
                clubUsed: document.getElementById('clubUsed').value
            });

            fetch(API + '/log?' + params.toString(), { method: 'POST' })
                .then(response => {
                    if (!response.ok) throw new Error('Failed to log shot. Check distance/lie.');
                    return response.json();
                })
                .then(data => {
                    setResult(data.strokesGained.toFixed(3) + ' (Saved to DB)', true);
                    loadShots();
                })
                .catch(error => setResult(error.message, false));
        });

        document.getElementById('undoBtn').addEventListener('click', function() {
            fetch(API + '/last', { method: 'DELETE' })
                .then(response => {
                    if (!response.ok) throw new Error('Nothing to undo.');
                    return response.json();
                })
                .then(shot => {
                    setResult('Undid shot #' + shot.id, true);
                    loadShots();
                })
                .catch(error => setResult(error.message, false));
        });

        document.getElementById('shotTableBody').addEventListener('click', function(e) {
            const btn = e.target.closest('button[data-id]');
            if (!btn) return;
            fetch(API + '/' + btn.dataset.id, { method: 'DELETE' })
                .then(response => {
                    if (!response.ok) throw new Error('Failed to delete shot.');
                    setResult('Shot Deleted', true);
                    loadShots();
                })
                .catch(error => setResult(error.message, false));
        });

        loadShots();
    </script>
</body>
</html>
