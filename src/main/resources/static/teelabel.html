<!-- temp, just made to label tee box locations -->
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tee Labeller</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 16px; color: #222; }
        .wrap { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
        .side { width: 380px; }
        canvas { border-radius: 6px; background: #111; cursor: crosshair; touch-action: none; }
        select, button { padding: 8px; font-size: 14px; }
        .teebtn { width: 100%; text-align: left; margin-bottom: 6px; border: 2px solid #ccc;
                  background: #fff; border-radius: 4px; cursor: pointer; }
        .teebtn.active { border-color: #1c7ed6; background: #e7f5ff; font-weight: 700; }
        .zoombar { margin: 8px 0; display: flex; gap: 6px; align-items: center; }
        .zoombar button { padding: 6px 12px; }
        table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 5px 7px; text-align: left; }
        th { background: #f4f6f8; }
        .ok { color: #1a7f37; font-weight: 700; }
        .warn { color: #b8860b; font-weight: 700; }
        .bad { color: #c0392b; font-weight: 700; }
        .muted { color: #888; font-size: 0.9em; }
        textarea { width: 100%; height: 160px; font-family: monospace; font-size: 11px; }
    </style>
</head>
<body>

<h2>Tee Labeller <span class="muted">— build tool, not part of the app</span></h2>

<div class="wrap">
    <div>
        <canvas id="cv"></canvas>
        <div class="zoombar">
            <button id="zin">+</button>
            <button id="zout">−</button>
            <button id="zfit">Fit</button>
            <span class="muted" id="zlabel">1.0×</span>
            <span class="muted">· scroll to zoom, drag to pan</span>
        </div>
    </div>

    <div class="side">
        <label>Hole: <select id="holeSel"></select></label>

        <p class="muted" style="margin:10px 0 4px">Pick a tee (or press 1–4), then click its box.</p>
        <div id="teeBtns"></div>

        <table>
            <thead><tr><th>Tee</th><th>Clicked</th><th>Card</th><th>Diff</th><th></th></tr></thead>
            <tbody id="teeTable"></tbody>
        </table>
        <p class="muted">
            Straight-line runs <em>shorter</em> than carded on doglegs, so a negative diff of
            10–40 yds is normal. Large or positive diffs mean the wrong box.
        </p>

        <div style="margin-top:12px">
            <button id="resetHole">Reset this hole to auto</button>
            <button id="clearTee">Clear selected tee</button>
        </div>

        <h3 style="margin-bottom:4px">Export <span class="muted" id="progress"></span></h3>
        <div><button id="showJson">JSON</button> <button id="showSql">SQL</button></div>
        <textarea id="out" placeholder="Click JSON or SQL"></textarea>
    </div>
</div>

<script>
    const M_PER_DEG_LAT = 111195, EARTH_R = 6371008.8, YD = 1.0936133;
    const NAMES = ["Cardinal", "Black", "White", "Blue"];
    const CV_W = 640, CV_H = 940;          // fixed viewport; the image pans/zooms inside it

    const GREENS = {
        1: [37.425558, -122.184179],  2: [37.427556, -122.188795],
        3: [37.427192, -122.190109],  4: [37.425501, -122.190973],
        5: [37.426478, -122.187251],  6: [37.423204, -122.186168],
        7: [37.424755, -122.190486],  8: [37.423792, -122.189647],
        9: [37.421341, -122.187090], 10: [37.418878, -122.184435],
       11: [37.420915, -122.186519], 12: [37.423520, -122.190672],
       13: [37.420831, -122.189341], 14: [37.420527, -122.187254],
       15: [37.418271, -122.189478], 16: [37.417666, -122.184347],
       17: [37.416620, -122.182765], 18: [37.420676, -122.184422]
    };
    const CARD = {   // Cardinal, Black, White, Blue
        1: [520,505,488,480],  2: [478,418,382,348],  3: [214,192,164,134],
        4: [167,143,120,101],  5: [444,385,346,335],  6: [426,403,386,324],
        7: [536,478,447,427],  8: [186,145,130,117],  9: [364,350,333,325],
       10: [430,401,376,338], 11: [360,350,338,332], 12: [474,442,425,403],
       13: [437,403,384,352], 14: [188,160,136,117], 15: [363,351,322,299],
       16: [505,492,442,431], 17: [196,175,158,141], 18: [454,420,394,359]
    };
    const AUTO = {
        1: [{n:"Cardinal",lat:37.420539,lng:-122.184017},{n:"Black",lat:37.421447,lng:-122.183446},{n:"White",lat:37.421560,lng:-122.183332},{n:"Blue",lat:37.421714,lng:-122.183272}],
        2: [{n:"Cardinal",lat:37.425899,lng:-122.184469},{n:"Black",lat:37.426191,lng:-122.184978},{n:"White",lat:37.426481,lng:-122.185134},{n:"Blue",lat:37.426669,lng:-122.185414}],
        3: [{n:"Cardinal",lat:37.428605,lng:-122.188780},{n:"Black",lat:37.428512,lng:-122.188980},{n:"White",lat:37.428316,lng:-122.189147},{n:"Blue",lat:37.428141,lng:-122.189369}],
        4: [{n:"Cardinal",lat:37.426871,lng:-122.190721},{n:"Black",lat:37.426699,lng:-122.190824},{n:"White",lat:37.426518,lng:-122.190957},{n:"Blue",lat:37.426347,lng:-122.191000}],
        5: [{n:"Cardinal",lat:37.425663,lng:-122.191740},{n:"Black",lat:37.424931,lng:-122.190909},{n:"White",lat:37.425066,lng:-122.190699},{n:"Blue",lat:37.425347,lng:-122.190416}],
        6: [{n:"Cardinal",lat:37.426699,lng:-122.186849},{n:"Black",lat:37.426463,lng:-122.186744},{n:"White",lat:37.425899,lng:-122.186353}],
        7: [{n:"Cardinal",lat:37.422764,lng:-122.186182},{n:"Black",lat:37.422911,lng:-122.186404},{n:"White",lat:37.423158,lng:-122.186600},{n:"Blue",lat:37.423359,lng:-122.186792}],
        8: [{n:"Cardinal",lat:37.423924,lng:-122.191596},{n:"Black",lat:37.423908,lng:-122.191119},{n:"White",lat:37.423922,lng:-122.190882}],
        9: [{n:"Cardinal",lat:37.423585,lng:-122.189106}],
       10: [{n:"Cardinal",lat:37.421912,lng:-122.186776},{n:"Black",lat:37.421745,lng:-122.186515},{n:"White",lat:37.421524,lng:-122.186476}],
       11: [{n:"Cardinal",lat:37.418515,lng:-122.184628}],
       12: [{n:"Cardinal",lat:37.421254,lng:-122.186289},{n:"Black",lat:37.420911,lng:-122.187042},{n:"White",lat:37.420937,lng:-122.187435},{n:"Blue",lat:37.421133,lng:-122.187461}],
       13: [{n:"Cardinal",lat:37.423648,lng:-122.191485},{n:"Black",lat:37.423502,lng:-122.191403},{n:"White",lat:37.423299,lng:-122.191206}],
       14: [{n:"Cardinal",lat:37.420445,lng:-122.189190},{n:"Black",lat:37.420467,lng:-122.188905},{n:"White",lat:37.420479,lng:-122.188659},{n:"Blue",lat:37.420205,lng:-122.188400}],
       15: [{n:"Cardinal",lat:37.420067,lng:-122.186777},{n:"Black",lat:37.419831,lng:-122.186920},{n:"White",lat:37.419653,lng:-122.187050}],
       16: [{n:"Cardinal",lat:37.417832,lng:-122.189414},{n:"Black",lat:37.417631,lng:-122.188844}],
       17: [{n:"Cardinal",lat:37.417028,lng:-122.184477},{n:"Black",lat:37.416874,lng:-122.184502}],
       18: [{n:"Cardinal",lat:37.417227,lng:-122.182661},{n:"Black",lat:37.417464,lng:-122.182871},{n:"White",lat:37.417649,lng:-122.183033},{n:"Blue",lat:37.417913,lng:-122.183170}]
    };

    let tees = {}, maps = {}, currentMap = null, img = null, hole = 1, activeTee = "Black";
    let fit = 1;                       // image px -> canvas px at zoom 1
    let z = 1, tx = 0, ty = 0;         // zoom and pan, in canvas pixels

    function load() {
        try {
            const saved = localStorage.getItem("teeLabels");
            if (saved) { tees = JSON.parse(saved); return; }
        } catch (e) { /* private mode — fall through to defaults */ }
        for (let n = 1; n <= 18; n++) {
            tees[n] = {};
            (AUTO[n] || []).forEach(t => tees[n][t.n] = { lat: t.lat, lng: t.lng });
        }
    }
    function save() { try { localStorage.setItem("teeLabels", JSON.stringify(tees)); } catch (e) {} }

    function haversineYards(a, b) {
        const r = d => d * Math.PI / 180;
        const dLat = r(b[0] - a[0]), dLng = r(b[1] - a[1]);
        const h = Math.sin(dLat/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLng/2)**2;
        return 2 * EARTH_R * Math.atan2(Math.sqrt(h), Math.sqrt(1-h)) * YD;
    }
    function latLngToPx(m, lat, lng) {
        const north = (lat - m.center.lat) * M_PER_DEG_LAT;
        const east  = (lng - m.center.lng) * M_PER_DEG_LAT * Math.cos(m.center.lat*Math.PI/180);
        const t = m.bearingDeg * Math.PI / 180;
        return { x: m.widthPx/2  + (east*Math.cos(t) - north*Math.sin(t)) / m.metersPerPixel,
                 y: m.heightPx/2 - (east*Math.sin(t) + north*Math.cos(t)) / m.metersPerPixel };
    }
    function pxToLatLng(m, x, y) {
        const across = (x - m.widthPx/2) * m.metersPerPixel;
        const along  = (m.heightPx/2 - y) * m.metersPerPixel;
        const t = m.bearingDeg * Math.PI / 180;
        const east  =  across*Math.cos(t) + along*Math.sin(t);
        const north = -across*Math.sin(t) + along*Math.cos(t);
        return { lat: m.center.lat + north/M_PER_DEG_LAT,
                 lng: m.center.lng + east/(M_PER_DEG_LAT*Math.cos(m.center.lat*Math.PI/180)) };
    }

    // image pixel -> canvas pixel, and back
    const toScreen = p => ({ x: tx + p.x * fit * z, y: ty + p.y * fit * z });
    const toImage  = (sx, sy) => ({ x: (sx - tx) / (fit * z), y: (sy - ty) / (fit * z) });

    function fitView() {
        if (!currentMap) return;
        fit = Math.min(CV_W / currentMap.widthPx, CV_H / currentMap.heightPx);
        z = 1;
        tx = (CV_W - currentMap.widthPx * fit) / 2;
        ty = (CV_H - currentMap.heightPx * fit) / 2;
        draw();
    }

    function draw() {
        const cv = document.getElementById("cv");
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#111"; ctx.fillRect(0, 0, cv.width, cv.height);
        if (!currentMap || !img || !img.complete) return;

        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, tx, ty, currentMap.widthPx * fit * z, currentMap.heightPx * fit * z);

        // green
        const g = GREENS[hole];
        const gp = toScreen(latLngToPx(currentMap, g[0], g[1]));
        ctx.fillStyle = "#00c2ff"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(gp.x, gp.y, 5, 0, 7); ctx.fill(); ctx.stroke();

        // tees — constant screen size regardless of zoom
        NAMES.forEach((name, i) => {
            const t = tees[hole][name];
            if (!t) return;
            const p = toScreen(latLngToPx(currentMap, t.lat, t.lng));
            const on = name === activeTee;
            const r = on ? 6 : 4;
            ctx.fillStyle = ["#f03e3e", "#212529", "#f8f9fa", "#1971c2"][i];
            ctx.strokeStyle = on ? "#ffd43b" : "#fff";
            ctx.lineWidth = on ? 2.5 : 1.5;
            ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill(); ctx.stroke();
            if (on) {   // thin crosshair on the active tee so the exact point is visible
                ctx.strokeStyle = "#ffd43b"; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(p.x - 14, p.y); ctx.lineTo(p.x - 8, p.y);
                ctx.moveTo(p.x + 8, p.y); ctx.lineTo(p.x + 14, p.y);
                ctx.moveTo(p.x, p.y - 14); ctx.lineTo(p.x, p.y - 8);
                ctx.moveTo(p.x, p.y + 8); ctx.lineTo(p.x, p.y + 14);
                ctx.stroke();
            }
            ctx.font = "bold 11px Arial"; ctx.textAlign = "left";
            ctx.strokeStyle = "#000"; ctx.lineWidth = 2.5;
            ctx.strokeText(name[0], p.x + 8, p.y - 6);
            ctx.fillStyle = "#fff";
            ctx.fillText(name[0], p.x + 8, p.y - 6);
        });
        document.getElementById("zlabel").innerText = z.toFixed(1) + "×";
    }

    function renderSide() {
        document.getElementById("teeBtns").innerHTML = NAMES.map(n =>
            `<button class="teebtn ${n===activeTee?'active':''}" data-tee="${n}">${n}</button>`
        ).join("");
        const g = GREENS[hole];
        document.getElementById("teeTable").innerHTML = NAMES.map((n, i) => {
            const t = tees[hole][n];
            if (!t) return `<tr><td>${n}</td><td colspan="3" class="muted">not set</td>
                            <td class="bad">missing</td></tr>`;
            const d = haversineYards([t.lat, t.lng], g), c = CARD[hole][i], diff = d - c;
            const cls = Math.abs(diff) <= 15 ? "ok" : (diff < 0 && diff > -45 ? "warn" : "bad");
            const tag = cls === "ok" ? "good" : (cls === "warn" ? "dogleg?" : "check");
            return `<tr><td>${n}</td><td>${d.toFixed(0)}</td><td>${c}</td>
                    <td>${diff>0?"+":""}${diff.toFixed(0)}</td><td class="${cls}">${tag}</td></tr>`;
        }).join("");
        let done = 0;
        for (let n = 1; n <= 18; n++) if (NAMES.every(t => tees[n][t])) done++;
        document.getElementById("progress").innerText = `— ${done}/18 holes complete`;
    }

    function selectHole() {
        hole = +document.getElementById("holeSel").value;
        currentMap = maps[hole];
        if (!currentMap) return;
        img = new Image();
        img.onload = () => { fitView(); };
        img.src = currentMap.imageUrl;
        renderSide();
    }

    const cv = document.getElementById("cv");
    cv.width = CV_W; cv.height = CV_H;

    function cvPoint(e) {
        const r = cv.getBoundingClientRect();
        return { x: (e.clientX - r.left) * (cv.width / r.width),
                 y: (e.clientY - r.top) * (cv.height / r.height) };
    }

    // zoom about the cursor, so the point under the pointer stays put
    cv.addEventListener("wheel", e => {
        e.preventDefault();
        const p = cvPoint(e);
        const k = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        const nz = Math.min(40, Math.max(0.5, z * k));
        const eff = nz / z;
        tx = p.x - (p.x - tx) * eff;
        ty = p.y - (p.y - ty) * eff;
        z = nz;
        draw();
    }, { passive: false });

    // drag to pan; a click that barely moved counts as placing a tee
    let dragging = false, moved = 0, last = null;
    cv.addEventListener("pointerdown", e => {
        dragging = true; moved = 0; last = cvPoint(e); cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener("pointermove", e => {
        if (!dragging) return;
        const p = cvPoint(e);
        tx += p.x - last.x; ty += p.y - last.y;
        moved += Math.abs(p.x - last.x) + Math.abs(p.y - last.y);
        last = p; draw();
    });
    cv.addEventListener("pointerup", e => {
        dragging = false;
        if (moved > 4 || !currentMap) return;          // it was a pan, not a click
        const p = cvPoint(e), ip = toImage(p.x, p.y);
        const ll = pxToLatLng(currentMap, ip.x, ip.y);
        tees[hole][activeTee] = { lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6) };
        save(); renderSide(); draw();
    });

    function zoomBy(k) {
        const nz = Math.min(40, Math.max(0.5, z * k)), eff = nz / z;
        tx = CV_W/2 - (CV_W/2 - tx) * eff;
        ty = CV_H/2 - (CV_H/2 - ty) * eff;
        z = nz; draw();
    }
    document.getElementById("zin").onclick = () => zoomBy(1.4);
    document.getElementById("zout").onclick = () => zoomBy(1/1.4);
    document.getElementById("zfit").onclick = fitView;

    document.getElementById("teeBtns").addEventListener("click", e => {
        const b = e.target.closest("[data-tee]");
        if (!b) return;
        activeTee = b.dataset.tee; renderSide(); draw();
    });
    document.getElementById("holeSel").addEventListener("change", selectHole);
    document.getElementById("resetHole").addEventListener("click", () => {
        tees[hole] = {};
        (AUTO[hole] || []).forEach(t => tees[hole][t.n] = { lat: t.lat, lng: t.lng });
        save(); renderSide(); draw();
    });
    document.getElementById("clearTee").addEventListener("click", () => {
        delete tees[hole][activeTee]; save(); renderSide(); draw();
    });
    document.addEventListener("keydown", e => {
        if (e.target.tagName === "TEXTAREA") return;
        if (e.key >= "1" && e.key <= "4") { activeTee = NAMES[+e.key - 1]; renderSide(); draw(); }
        if (e.key === "f") fitView();
    });

    document.getElementById("showJson").addEventListener("click", () => {
        document.getElementById("out").value = JSON.stringify(tees, null, 1);
    });
    document.getElementById("showSql").addEventListener("click", () => {
        let s = "-- hole_tee seed, produced by teelabel.html\n\n";
        for (let n = 1; n <= 18; n++) NAMES.forEach((t, i) => {
            const v = tees[n][t]; if (!v) return;
            s += `INSERT INTO hole_tee (hole_id, tee_name, lat, lng, yards)\n` +
                 `SELECT h.id, '${t}', ${v.lat}, ${v.lng}, ${CARD[n][i]}\n` +
                 `FROM hole h JOIN course c ON c.id = h.course_id\n` +
                 `WHERE c.name = 'Stanford Golf Course' AND h.hole_number = ${n};\n\n`;
        });
        document.getElementById("out").value = s;
    });

    load();
    fetch("/api/v1/courses/1/bundle", { cache: "no-cache" })
        .then(r => r.json())
        .then(course => {
            const sel = document.getElementById("holeSel");
            course.holes.forEach(h => {
                maps[h.holeNumber] = h.map;
                sel.add(new Option(`Hole ${h.holeNumber} (par ${h.par})`, h.holeNumber));
            });
            selectHole();
        });
</script>
</body>
</html>
